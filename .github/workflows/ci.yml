name: Linux tests and documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    name: Linux tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      LC_ALL: C.UTF-8
      TERM: xterm-256color
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install rendered-screen test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tmux
      - name: Smoke-test passive diagnostics
        shell: bash
        env:
          CLI_HELP_DRIVERS: ${{ github.workspace }}/config/drivers.example
          CLI_HELP_PROFILES: ''
          CLI_HELP_CONFIG: ''
          CLI_HELP_DISCOVERY: 'off'
          CLI_HELP_CACHE_DIR: ${{ runner.temp }}/cli-help-passive-cache
        run: |
          set -euo pipefail
          mkdir -p tests/reports/ci
          python3 cli_help/main.py --doctor > tests/reports/ci/diagnostics-doctor.json
          export CLI_HELP_LINE='docker compose -f example.yml --profile debug up --det'
          export CLI_HELP_POINT=${#CLI_HELP_LINE}
          python3 cli_help/main.py --explain > tests/reports/ci/diagnostics-explain.json
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          reports = Path("tests/reports/ci")
          doctor = json.loads((reports / "diagnostics-doctor.json").read_text())
          explanation = json.loads((reports / "diagnostics-explain.json").read_text())
          assert doctor["status"] == "ok"
          assert doctor["configuration"]["driver_selection"]["supplied_selected"]
          assert doctor["configuration"]["escape_delay_ms"] == 40
          assert explanation["resolved_command"] == ["docker", "compose", "up"]
          assert explanation["code"] == "discovery_disabled"
          assert explanation["route"]["kind"] == "configured"
          assert explanation["route"]["help_arguments"] == ["compose", "up", "--help"]
          assert "example.yml" not in json.dumps(explanation)
          private_constant = "CI_PRIVATE_DRIVER_SENTINEL"
          pending_operand = "CI_PRIVATE_BUFFER_SENTINEL"
          with tempfile.TemporaryDirectory(prefix="cli-help-review-config-", dir=os.environ["RUNNER_TEMP"]) as directory:
              folder = Path(directory)
              drivers = folder / "drivers"
              profiles = folder / "profiles"
              drivers.mkdir()
              profiles.mkdir()
              binaries = folder / "bin"
              binaries.mkdir()
              target_started = folder / "target-started"
              fixture = binaries / "fixture"
              fixture.write_text("#!" + sys.executable + "\nfrom pathlib import Path\nPath(" + repr(str(target_started)) + ").touch()\n")
              fixture.chmod(0o700)
              driver = {"command": "fixture", "paths": [{"command": [],
                  "help": ["--help", "--token=" + private_constant, "--password", private_constant],
                  "man": "private-" + private_constant}]}
              (drivers / "fixture.json").write_text(json.dumps(driver))
              for filename, command in (("root.json", ["fixture"]), ("leaf.json", ["fixture", "review-leaf"])):
                  profile = {"command": command, "description": "CI fixture",
                      "categories": [{"name": "Options", "options": [
                          {"flag": "--flag", "summary": "Fixture flag"},
                          {"flag": "-a", "bundle": True, "summary": "First fixture flag"},
                          {"flag": "-b", "bundle": True, "summary": "Second fixture flag"},
                          {"flag": "-n", "argument": "COUNT", "argument_style": "attached_only",
                           "bundle": True, "summary": "Attached fixture value"}]}]}
                  (profiles / filename).write_text(json.dumps(profile))
              environment = dict(os.environ, CLI_HELP_DRIVERS=str(drivers), CLI_HELP_PROFILES=str(profiles),
                  PATH=str(binaries) + os.pathsep + os.environ["PATH"])
              for filename, command, kind in (("diagnostics-private-driver.json", "fixture", "configured"),
                                               ("diagnostics-static-profile.json", "fixture review-leaf", "profile_only")):
                  prefix = command + " --fl"
                  environment.update(CLI_HELP_LINE=prefix + " '" + pending_operand + "'", CLI_HELP_POINT=str(len(prefix)))
                  result = subprocess.run([sys.executable, "-B", "cli_help/main.py", "--explain"],
                      env=environment, check=True, capture_output=True, text=True, timeout=10)
                  assert private_constant not in result.stdout + result.stderr
                  assert pending_operand not in result.stdout + result.stderr
                  report = json.loads(result.stdout)
                  assert report["status"] == "ready"
                  assert report["route"]["kind"] == kind
                  if kind == "configured":
                      assert report["route"]["help_arguments_redacted"]
                      assert report["route"]["manual_redacted"]
                  else:
                      assert report["route"]["help_arguments"] == []
                      assert report["profile"]["kind"] == "custom"
                  (reports / filename).write_text(result.stdout)
              # Collection inspection uses the same private fixture without
              # starting its target or changing any collection-owned bytes.
              before = {path.relative_to(folder).as_posix(): path.read_bytes()
                  for path in folder.rglob('*') if path.is_file()}
              result = subprocess.run([sys.executable, "-B", "cli_help/main.py", "--check-collection", str(folder)],
                  env=environment, check=True, capture_output=True, text=True, timeout=10)
              assert private_constant not in result.stdout + result.stderr
              assert pending_operand not in result.stdout + result.stderr
              report = json.loads(result.stdout)
              assert report["status"] == "attention_required"
              assert {item["code"] for item in report["findings"]} == {"profile_route_missing"}
              assert report["inspection_complete"]
              after = {path.relative_to(folder).as_posix(): path.read_bytes()
                  for path in folder.rglob('*') if path.is_file()}
              assert before == after
              (reports / "diagnostics-collection.json").write_text(result.stdout)
              prefix = "fixture -abn --fl"
              environment.update(CLI_HELP_LINE=prefix + " '" + pending_operand + "'", CLI_HELP_POINT=str(len(prefix)))
              result = subprocess.run([sys.executable, "-B", "cli_help/main.py", "--explain"],
                  env=environment, capture_output=True, text=True, timeout=10)
              assert result.returncode == 1
              assert private_constant not in result.stdout + result.stderr
              assert pending_operand not in result.stdout + result.stderr
              report = json.loads(result.stdout)
              assert report["status"] == "rejected"
              assert report["code"] == "option_value_required"
              (reports / "diagnostics-bundle-rejection.json").write_text(result.stdout)
              # Invalid collection input is retained exactly; inspection does
              # not attempt recovery, start a target, or expose its contents.
              (drivers / "fixture.json").write_text(json.dumps([private_constant]))
              before = {path.relative_to(folder).as_posix(): path.read_bytes()
                  for path in folder.rglob('*') if path.is_file()}
              result = subprocess.run([sys.executable, "-B", "cli_help/main.py", "--check-collection", str(folder)],
                  env=environment, capture_output=True, text=True, timeout=10)
              assert result.returncode == 1
              assert private_constant not in result.stdout + result.stderr
              assert pending_operand not in result.stdout + result.stderr
              report = json.loads(result.stdout)
              assert report["status"] == "invalid"
              assert "collection_json_invalid" in {item["code"] for item in report["findings"]}
              after = {path.relative_to(folder).as_posix(): path.read_bytes()
                  for path in folder.rglob('*') if path.is_file()}
              assert before == after
              assert not target_started.exists()
              (reports / "diagnostics-collection-invalid.json").write_text(result.stdout)
          assert not Path(os.environ["CLI_HELP_CACHE_DIR"]).exists()
          PY
      - name: Run full Linux test suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/reports/ci
          bash tests/run.sh 2>&1 | tee tests/reports/ci/linux-tests.log
      - name: Retain test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-tests-python-${{ matrix.python }}
          # Only fixed-input diagnostic reports and the suite log are retained.
          # Raw captures, downloaded targets, tool homes, and caches stay local.
          path: |
            tests/reports/ci/linux-tests.log
            tests/reports/ci/diagnostics-doctor.json
            tests/reports/ci/diagnostics-explain.json
            tests/reports/ci/diagnostics-private-driver.json
            tests/reports/ci/diagnostics-static-profile.json
            tests/reports/ci/diagnostics-collection.json
            tests/reports/ci/diagnostics-collection-invalid.json
            tests/reports/ci/diagnostics-bundle-rejection.json
          if-no-files-found: warn
          retention-days: 14

  documentation:
    name: Documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore successful link responses
        id: lychee-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-v0.24.2-${{ hashFiles('lychee.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lychee-${{ runner.os }}-v0.24.2-${{ hashFiles('lychee.toml') }}-
      - name: Check local and external documentation links
        id: documentation-links
        # The final gate retains strict failure handling after one permitted retry.
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --no-progress '**/*.md'
          fail: true
          failIfEmpty: true
          output: tests/reports/documentation-links-attempt-1.md
          jobSummary: true
      - name: Resolve documentation check with one bounded retry
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 scripts/retry_documentation_links.py --first-outcome '${{ steps.documentation-links.outcome }}'
      - name: Save successful link responses
        if: ${{ always() && steps.lychee-cache.outputs.cache-primary-key != '' && hashFiles('.lycheecache') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: ${{ steps.lychee-cache.outputs.cache-primary-key }}
      - name: Retain documentation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-links
          path: |
            tests/reports/documentation-links.md
            tests/reports/documentation-links-attempt-*.md
            tests/reports/documentation-links-attempt-2.log
            tests/reports/gnu-response-headers.txt
          if-no-files-found: warn
          retention-days: 14
