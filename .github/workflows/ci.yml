name: Linux tests and documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    name: Linux tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      LC_ALL: C.UTF-8
      TERM: xterm-256color
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install rendered-screen test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tmux
      - name: Run full Linux test suite
        shell: bash
        run: |
          mkdir -p tests/reports/ci
          bash tests/run.sh 2>&1 | tee tests/reports/ci/linux-tests.log
      - name: Retain test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-tests-python-${{ matrix.python }}
          path: tests/reports/ci/linux-tests.log
          if-no-files-found: warn
          retention-days: 14

  documentation:
    name: Documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore successful link responses
        id: lychee-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-v0.24.2-${{ hashFiles('lychee.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lychee-${{ runner.os }}-v0.24.2-${{ hashFiles('lychee.toml') }}-
      - name: Check local and external documentation links
        id: documentation-links
        # The final gate retains strict failure handling after one permitted retry.
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --no-progress '**/*.md'
          fail: true
          failIfEmpty: true
          output: tests/reports/documentation-links-attempt-1.md
          jobSummary: true
      - name: Resolve documentation check with one bounded retry
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 scripts/retry_documentation_links.py --first-outcome '${{ steps.documentation-links.outcome }}'
      - name: Save successful link responses
        if: ${{ always() && steps.lychee-cache.outputs.cache-primary-key != '' && hashFiles('.lycheecache') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: ${{ steps.lychee-cache.outputs.cache-primary-key }}
      - name: Retain documentation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-links
          path: |
            tests/reports/documentation-links.md
            tests/reports/documentation-links-attempt-*.md
            tests/reports/documentation-links-attempt-2.log
            tests/reports/gnu-response-headers.txt
          if-no-files-found: warn
          retention-days: 14
