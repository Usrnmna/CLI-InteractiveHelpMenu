name: Bug report
description: Report a reproducible browser, command-context, discovery, or update problem.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        Reports should use synthetic filenames, hosts, and argument values.
        Credentials, private paths, full command history, and unredacted buffers
        or probe output must be omitted. Diagnostic reports can contain local
        configuration paths; review and redact those paths before sharing.
  - type: input
    id: revision
    attributes:
      label: Project version or checkout revision
      description: Specify the version or checkout commit, local modifications, and whether this is a preserved release or an unpublished local candidate.
    validations:
      required: true
  - type: textarea
    id: package
    attributes:
      label: Package or local candidate
      description: For packaging or update problems, identify source/native/installer format, artifact name, checksum result, source-manifest agreement, and install/update/review exit status. Omit private paths, raw manifests, receipts, and backup contents.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Linux distribution or WSL, Bash and Python versions, terminal emulator, TERM, tmux version, Readline editing mode/keymap, and any CLI_HELP_ESCAPE_DELAY override when relevant. Omit private paths.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Driver and profile setup
      description: Identify built-in, supplied, or custom driver selection, discovery mode, and the affected route. Include relevant provenance or reason codes; omit private paths and configuration contents.
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Describe the shortcut, cursor position, and steps using synthetic command arguments. No operational workload is required.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Distinguish command-buffer changes, visible rendering, and separate help-discovery requests.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostic summary
      description: Optional summary of --doctor, --explain, or --check-collection status/reason codes. For interpreter startup failures, give the runtime role/reason without the configured value. For recovery, summarize explicit choices, changed-file warnings, uncertain locks, and retained backups. Omit private paths, snapshots, configuration contents, raw reports, and backup contents.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Report privacy
      options:
        - label: Credentials, private paths, and unredacted command buffers or logs are omitted.
          required: true
