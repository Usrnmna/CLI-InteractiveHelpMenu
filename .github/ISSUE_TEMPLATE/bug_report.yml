name: Bug report
description: Report a reproducible browser, command-context, discovery, or update problem.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        Reports should use synthetic filenames, hosts, and argument values.
        Credentials, private paths, full command history, and unredacted buffers
        or probe output must be omitted. Diagnostic reports can contain local
        configuration paths; review and redact those paths before sharing.
  - type: input
    id: revision
    attributes:
      label: Project version or checkout revision
      description: Specify the release version or checkout commit, and whether local modifications are present.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Linux distribution or WSL, Bash and Python versions, terminal emulator, TERM, tmux version, Readline editing mode/keymap, and any CLI_HELP_ESCAPE_DELAY override when relevant. Omit private paths.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Driver and profile setup
      description: Identify built-in, supplied, or custom driver selection, discovery mode, and the affected route. Include relevant provenance or reason codes; omit private paths and configuration contents.
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Describe the shortcut, cursor position, and steps using synthetic command arguments. No operational workload is required.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Distinguish command-buffer changes, visible rendering, and separate help-discovery requests.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostic summary
      description: Optional summary of --doctor, --explain, or --check-collection status/reason codes. For recovery, describe the explicit choice, layout or changed-file warning, uncertain lock state, and retained-backup availability. Omit paths, backup identifiers, snapshots, hashes, configuration contents, raw reports, and backups.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Report privacy
      options:
        - label: Credentials, private paths, and unredacted command buffers or logs are omitted.
          required: true
