# Check Markdown file/image targets, heading anchors, and external HTTP(S) links.
include_fragments = "anchor-only"
max_concurrency = 4
timeout = 20
max_retries = 2
retry_wait_time = 2
exclude_all_private = true

# Generated reports and dependency environments are not maintained documentation.
exclude_path = [
  '(^|/)(\.git|\.venv|__pycache__)(/|$)',
  '(^|/)tests/reports(/|$)',
]

# The workflow endpoint may not exist until the first push/run. Exclude only
# this workflow's page and badge; other GitHub documentation remains checked.
exclude = [
  '^https://github\.com/Usrnmna/CLI-InteractiveHelpMenu/actions/workflows/ci\.yml(/badge\.svg)?(\?.*)?$',
]
