# Check Markdown file/image targets, heading anchors, and external HTTP(S) links.
include_fragments = "anchor-only"
max_concurrency = 4
timeout = 20
max_retries = 2
retry_wait_time = 2
exclude_all_private = true

# Reuse successful responses for one day; failures must be checked again.
cache = true
max_cache_age = "1d"
cache_exclude_status = "100..=199,300..=999"

# Generated reports and dependency environments are not maintained documentation.
exclude_path = [
  '(^|/)(\.git|\.cache|\.venv|venv|__pycache__|dist|generated-help)(/|$)',
  '(^|/)tests/reports(/|$)',
  '(^|/)\.review-backups(/|$)',
  '(^|/)(lychee|node_modules)(/|$)',
  '(^|/)\.(aws|ssh|gnupg|kube|docker|azure|dotnet|nuget|bun|ansible|arduino15|npm)(/|$)',
  '(^|/)\.config/(gh|gcloud|containers|cli-help)(/|$)',
  '(^|/)\.local/share/(containers|cli-interactive-help)(/|$)',
  '(^|/)([^/]+\.(update-backup|update-review-backup|release-update)-[^/]+|\.cli-help-stage-[^/]+)/',
  '(^|/)cli-help-(probe|review|screen|description-screen|sanitized-screen|replay|build|media|ignore|inventory|capture|functional-review|workflow-verification)-[^/]+/',
  '(^|/)cli-help-installer\.[^/]+/',
]

# Workflow and badge endpoints are checked with the other external links.

# Serialize GNU requests and space them apart to reduce HTTP 429 responses.
[hosts."www.gnu.org"]
concurrency = 1
request_interval = "10s"
# Identify the project; GNU rejects the default Lychee User-Agent on these pages.
headers = { "User-Agent" = "CLI-InteractiveHelpMenu-link-check (+https://github.com/Usrnmna/CLI-InteractiveHelpMenu)" }
